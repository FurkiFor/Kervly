name: Deploy

# Deploys to your own Cloudflare account. Runs only when the repository variables are set,
# so forks and clones do nothing until their owner configures them (see docs/SELF_HOSTING.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and tests
        run: npx tsc && npx vitest run
      - name: Render deployment config
        run: node scripts/render-config.mjs
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_OAUTH_ID: ${{ vars.KV_OAUTH_ID }}
          KV_SESSIONS_ID: ${{ vars.KV_SESSIONS_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          DEFAULT_LANG: ${{ vars.DEFAULT_LANG }}
          MCP_LANG: ${{ vars.MCP_LANG }}
          MEDIA_ALLOWED_HOSTS: ${{ vars.MEDIA_ALLOWED_HOSTS }}
          MAX_POSTS_PER_DAY_CEILING: ${{ vars.MAX_POSTS_PER_DAY_CEILING }}
          TIKTOK_UNAUDITED: ${{ vars.TIKTOK_UNAUDITED }}
      - name: Database migrations
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy -c wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
