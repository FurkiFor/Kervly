name: Owner only

# Pull requests are accepted from the repository owner only. Anyone else's pull request is closed right away.
# Dependabot (configured in .github/dependabot.yml) is the one exception.
# This runs on pull_request_target and never checks out or executes code from the pull request.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-outside-prs:
    if: ${{ github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for the interest. This repository does not accept outside pull requests, so this one was closed automatically. Bugs and ideas can be reported privately through Security → Report a vulnerability, or by emailing the owner. / Bu depo dışarıdan pull request kabul etmiyor, bu yüzden otomatik kapatıldı."
